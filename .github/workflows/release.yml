name: Release

# Stable release - MANUAL dispatch only. Builds the library via the reusable
# _build.yml (where the PowerBASIC 3.5 compile is REQUIRED) and publishes the
# directly-usable source-include library bundle as a GitHub release asset.
# (Once the multi-unit SVGA.PBL build lands, attach the compiled .PBL here too.)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (defaults to %SVGA_VERSION_* from TYPES.SUB).'
        required: false
      reason:
        description: 'Why are you cutting this release? (optional, for the audit log)'
        required: false

permissions:
  contents: write

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Required structural gate before we spend time on the real build.
  check:
    uses: ./.github/workflows/ci.yml

  version:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # the build number is a commit count
      # The source stays the single version authority (TYPES.SUB %SVGA_VERSION_*, exposed at runtime
      # via Svga_Version$); the shared versioner reads those constants and appends the commit count
      # of their folder, so the library version tracks its own churn instead of being hand-bumped.
      - id: auto
        uses: Hawkynt/RepositoryTemplate/stamp-version@v1
        with:
          mode: print
      - id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="${{ steps.auto.outputs.version }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Package version: $V"

  build:
    needs: version
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      # The repo-level marker is the DATE, like every other Hawkynt repo — the library's own
      # MAJOR.MINOR.PATCH.BUILD stays the package version and is quoted in the notes below.
      - name: Compose release marker
        run: echo "REL=v$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - name: Compose release notes
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<EOF
          ## PB-SvgaLibrary $REL (library v$V)

          The compiled **PowerBASIC 3.5 SVGA library**: \`SVGA.PBL\` plus its
          \`SVGA.BI\` interface (with \`SVGATYPE.BI\`/\`SVGADECL.BI\`), README and
          LICENSE. Consume it with \`\$INCLUDE "SVGA.BI"\` and \`\$LINK "SVGA.PBL"\` -
          the runtime version is available in-program via \`Svga_Version\$\`.
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL }}
          name: ${{ env.REL }} (library v${{ needs.version.outputs.version }})
          files: dist/svga-library.zip
          body_path: RELEASE_NOTES.md
